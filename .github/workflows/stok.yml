# Togg T10F V2 RWD Uzun Menzil stok takibi — GitHub Actions
#
# GitHub cron en az 5 dk'ya izin verdiği için her 30 dk'da bir iş başlatılır ve
# o iş ~55 dk boyunca kendi içinde 4 dk'da bir kontrol eder. Yeni iş başlayınca
# eskisi iptal edilir (concurrency) → kesintisiz ~4 dk aralık.
#
# Gerekli Secrets (Settings → Secrets and variables → Actions):
#   TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID

name: Togg stok kontrol

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      dump:
        description: "Sadece sayfa dump'ı al (page.txt, page.png, JSON'lar) ve artifact olarak yükle"
        type: boolean
        default: false

concurrency:
  group: togg-stok
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Bağımlılıklar
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Önceki durumu geri yükle (state.json)
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: togg-state-${{ github.run_id }}
          restore-keys: togg-state-

      - name: Sayfa dump'ı
        if: ${{ inputs.dump }}
        run: python togg_stok_bot.py --dump -v

      - name: Dump'ı artifact olarak yükle
        if: ${{ inputs.dump }}
        uses: actions/upload-artifact@v4
        with:
          name: togg-dump
          path: dump/

      - name: Kontrol döngüsü (~55 dk, 4 dk aralık)
        if: ${{ !inputs.dump }}
        run: python togg_stok_bot.py --interval 240 --max-runtime 3300

      - name: Durumu kaydet (state.json)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: togg-state-${{ github.run_id }}
