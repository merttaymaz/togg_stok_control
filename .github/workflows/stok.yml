# Togg T10F V2 RWD Uzun Menzil stok takibi — GitHub Actions
#
# GitHub cron en az 5 dk'ya izin verdiği için her 30 dk'da bir iş başlatılır ve
# o iş ~55 dk boyunca kendi içinde 4 dk'da bir kontrol eder. Yeni iş başlayınca
# eskisi iptal edilir (concurrency) → kesintisiz ~4 dk aralık.
#
# Gerekli Secrets (Settings → Secrets and variables → Actions):
#   TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID
# İsteğe bağlı Variable: CHECK_MODE=browser (varsayılan api)

name: Togg stok kontrol

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      dump:
        description: "Sadece tek kontrol yap, ham veriyi loga ve artifact'e yaz"
        type: boolean
        default: false
      test_telegram:
        description: "Sadece Telegram'a test mesajı gönder"
        type: boolean
        default: false

concurrency:
  group: togg-stok
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      CHECK_MODE: ${{ vars.CHECK_MODE || 'api' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Bağımlılıklar
        run: pip install -r requirements.txt

      - name: Playwright (sadece browser modunda)
        if: ${{ env.CHECK_MODE == 'browser' }}
        run: python -m playwright install --with-deps chromium

      - name: Önceki durumu geri yükle (state.json)
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: togg-state-${{ github.run_id }}
          restore-keys: togg-state-

      - name: Telegram testi
        if: ${{ inputs.test_telegram }}
        run: python togg_stok_bot.py --test-telegram

      - name: Dump
        if: ${{ inputs.dump }}
        run: python togg_stok_bot.py --dump -v

      - name: Dump özeti (log)
        if: ${{ inputs.dump }}
        run: |
          for f in dump/endpoints.txt dump/page.txt dump/products.json dump/json_*.json; do
            [ -f "$f" ] || continue
            echo; echo "=== $f ==="; head -c 30000 "$f"
          done

      - name: Dump'ı artifact olarak yükle
        if: ${{ inputs.dump }}
        uses: actions/upload-artifact@v4
        with:
          name: togg-dump
          path: dump/

      - name: Kontrol döngüsü (~55 dk, 4 dk aralık)
        if: ${{ !inputs.dump && !inputs.test_telegram }}
        run: python togg_stok_bot.py --interval 240 --max-runtime 3300

      - name: Durumu kaydet (state.json)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: togg-state-${{ github.run_id }}
